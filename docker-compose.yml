services:
  postgres:
    image: postgres:16-alpine
    container_name: kst-dashboardexe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kst_dashboardexe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kst_dashboardexe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kst_dashboardexe"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kst_dashboardexe_pgdata:
